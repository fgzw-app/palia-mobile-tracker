name: Update Palia Weekly Wants

on:
  schedule:
    # Runs at 21:05 UTC every Sunday (which is Monday 05:05 AM Singapore Time)
    - cron: '5 21 * * 0'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Scraper
        run: node scripts/update_wants.js

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add wants.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): auto-update weekly wants [skip ci]" && git push)

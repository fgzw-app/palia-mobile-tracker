name: Auto-Sync Palia Weekly Wants

on:
  schedule:
    # Runs Monday at 05:00 UTC (1:00 PM SGT) after the weekly reset
    - cron: '0 5 * * 1'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Scrape Wants from Palia Wiki
        run: |
          python - << 'EOF'
          import json
          import re
          import sys
          import urllib.request
          from datetime import datetime

          WIKI_API = "https://palia.wiki.gg/api.php?action=parse&page=Villagers/Weekly_Wants&prop=text&format=json"
          HEADERS = {
              "User-Agent": "PaliaCompanionGuideBot/2.0 (Mobile App Data Sync; contact@github.com)"
          }

          KNOWN_VILLAGERS = [
              "Ashura", "Auni", "Badruu", "Caleri", "Chayne", "Delaila", "Einar",
              "Elouisa", "Eshe", "Hassian", "Hekla", "Hodari", "Jel", "Jina",
              "Kenli", "Kenyatta", "Nai'o", "Najuma", "Reth", "Sifuu", "Subira",
              "Tamala", "Tau", "The Gardener", "Tish", "Ulfe", "Zeki"
          ]

          try:
              print(f"Fetching from {WIKI_API}...")
              req = urllib.request.Request(WIKI_API, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=30) as res:
                  data = json.loads(res.read().decode('utf-8'))

              html = data.get("parse", {}).get("text", {}).get("*", "")
              if not html:
                  print("Error: Received empty HTML from MediaWiki API.", file=sys.stderr)
                  sys.exit(1)

              # Extract all table rows
              rows = re.findall(r'<tr[^>]*>(.*?)</tr>', html, re.DOTALL | re.IGNORECASE)
              villagers_dict = {}

              for row in rows:
                  # Extract all table cells
                  cells = re.findall(r'<t[dh][^>]*>(.*?)</t[dh]>', row, re.DOTALL | re.IGNORECASE)
                  if not cells:
                      continue

                  # Clean HTML tags and entities from each cell
                  clean_cells = []
                  for c in cells:
                      text = re.sub(r'<[^>]+>', ' ', c)
                      text = re.sub(r'&#\d+;|&[a-z]+;', ' ', text)
                      text = re.sub(r'\(.*?\)', '', text) # Remove notes like (Star)
                      text = re.sub(r'\s+', ' ', text).strip()
                      if text:
                          clean_cells.append(text)

                  if not clean_cells:
                      continue

                  # Check if the first cell matches a villager name
                  first_cell = clean_cells[0]
                  matched_villager = None
                  for v in KNOWN_VILLAGERS:
                      if v.lower() == first_cell.lower() or v.lower() in first_cell.lower():
                          matched_villager = v
                          break

                  if matched_villager and matched_villager not in villagers_dict:
                      # The remaining cells in the wiki table contain the weekly wants
                      items = []
                      for candidate in clean_cells[1:]:
                          cand_clean = candidate.strip()
                          if (len(cand_clean) > 2 
                              and cand_clean.lower() not in ("like", "love", "unknown", "item", "wants", "gift")
                              and not any(cand_clean.lower() == k.lower() for k in KNOWN_VILLAGERS)):
                              if cand_clean not in items:
                                  items.append(cand_clean)

                      if len(items) >= 3:
                          wants = []
                          for idx, itm in enumerate(items[:4]):
                              # Palia Wiki standard: slots 1 & 2 are Likes, slots 3 & 4 are Loves
                              wants.append({
                                  "name": itm,
                                  "love": idx >= 2
                              })
                          villagers_dict[matched_villager] = wants

              if len(villagers_dict) < 5:
                  print(f"Warning: Extracted only {len(villagers_dict)} villagers from table. Retaining current wants.json.", file=sys.stderr)
                  sys.exit(0)

              formatted_list = []
              for name, wants in villagers_dict.items():
                  formatted_list.append({
                      "name": name,
                      "loc": "Kilima / Bahari",
                      "wants": wants
                  })

              output = {
                  "updated_at": datetime.utcnow().strftime("%Y-%m-%d %H:%M:%S UTC"),
                  "villagers": formatted_list
              }

              with open("wants.json", "w", encoding="utf-8") as f:
                  json.dump(output, f, indent=2, ensure_ascii=False)

              print(f"Success: Synced {len(formatted_list)} clean villagers from Palia Wiki!")

          except Exception as e:
              print(f"Scraping error: {e}", file=sys.stderr)
              sys.exit(1)
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add wants.json
          if git diff --staged --quiet; then
            echo "No changes in wants.json to commit."
          else
            git commit -m "chore(data): auto-update weekly wants from palia.wiki.gg [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

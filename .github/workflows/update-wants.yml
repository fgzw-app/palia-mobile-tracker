name: Auto-Sync Palia Weekly Wants

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Scrape Clean Paliapedia Wants
        run: |
          python - << 'EOF'
          import json
          import re
          import sys
          import urllib.request
          from datetime import datetime

          URL = "https://paliapedia.com/tools/weekly-wants"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
          }

          VILLAGERS = [
              "Ashura", "Auni", "Badruu", "Caleri", "Chayne", "Delaila", "Einar",
              "Elouisa", "Eshe", "Hassian", "Hekla", "Hodari", "Jel", "Jina",
              "Kenli", "Kenyatta", "Nai'o", "Najuma", "Reth", "Sifuu", "Subira",
              "Tamala", "Tau", "The Gardener", "Tish", "Ulfe", "Zeki"
          ]

          BANNED = {"gifts", "gift", "div", "class", "like", "love", "items", "wants", "true", "false", "item"}

          try:
              print(f"Requesting {URL}...")
              req = urllib.request.Request(URL, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=25) as res:
                  html = res.read().decode("utf-8")

              # Strip HTML tags and normalize text
              clean_text = re.sub(r'<[^>]+>', '\n', html)
              lines = [re.sub(r'\s+', ' ', l).strip() for l in clean_text.splitlines() if l.strip()]

              villagers_dict = {}

              for i, line in enumerate(lines):
                  matched_name = None
                  for v in VILLAGERS:
                      if line.lower() in (f"{v} gifts".lower(), v.lower()):
                          matched_name = v
                          break

                  if matched_name and matched_name not in villagers_dict:
                      wants = []
                      # Look at the next 12 lines for item names
                      for candidate in lines[i+1:i+16]:
                          cand_clean = re.sub(r'[\*\•\-\(\)]', '', candidate).strip()
                          if (len(cand_clean) > 2 
                              and cand_clean.lower() not in BANNED 
                              and not any(cand_clean.lower().startswith(b) for b in ("div", "class", "http"))
                              and not any(cand_clean.lower() == v.lower() or cand_clean.lower() == f"{v} gifts".lower() for v in VILLAGERS)):
                              if cand_clean not in [w["name"] for w in wants]:
                                  is_love = len(wants) >= 2
                                  wants.append({"name": cand_clean, "love": is_love})
                          if len(wants) == 4:
                              break
                      if len(wants) >= 3:
                          villagers_dict[matched_name] = wants

              if len(villagers_dict) < 5:
                  print("Warning: Parser found insufficient villagers. Preserving existing wants.json.", file=sys.stderr)
                  sys.exit(0)

              formatted_list = []
              for name, wants in villagers_dict.items():
                  formatted_list.append({
                      "name": name,
                      "loc": "Kilima / Bahari",
                      "wants": wants
                  })

              output = {
                  "updated_at": datetime.utcnow().strftime("%Y-%m-%d %H:%M:%S UTC"),
                  "villagers": formatted_list
              }

              with open("wants.json", "w", encoding="utf-8") as f:
                  json.dump(output, f, indent=2, ensure_ascii=False)

              print(f"Successfully synced {len(formatted_list)} clean villagers from Paliapedia!")

          except Exception as e:
              print(f"Scraper error: {e}", file=sys.stderr)
              sys.exit(0)
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add wants.json
          if git diff --staged --quiet; then
            echo "No changes in wants.json to commit."
          else
            git commit -m "chore(data): sync clean weekly wants from paliapedia [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

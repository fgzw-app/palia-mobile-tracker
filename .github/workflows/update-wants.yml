name: Auto-Sync Palia Weekly Wants

on:
  schedule:
    # Runs Monday at 10:00 UTC (6:00 PM SGT)
    - cron: '0 10 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Scrape Wants from palia.gaming.tools Feed
        run: |
          python - << 'EOF'
          import json
          import re
          import sys
          import urllib.request
          from datetime import datetime

          KNOWN_VILLAGERS = [
              "Ashura", "Auni", "Badruu", "Caleri", "Chayne", "Delaila", "Einar",
              "Elouisa", "Eshe", "Hassian", "Hekla", "Hodari", "Jel", "Jina",
              "Kenli", "Kenyatta", "Nai'o", "Najuma", "Reth", "Sifuu", "Subira",
              "Tamala", "Tau", "The Gardener", "Tish", "Ulfe", "Zeki"
          ]

          VILLAGER_LOCATIONS = {
              "Ashura": "Kilima Tavern",
              "Auni": "Tavern / Fields",
              "Badruu": "Daiya Farm",
              "Caleri": "Library",
              "Chayne": "Apothecary",
              "Delaila": "Daiya Farm",
              "Einar": "Fisherman Lagoon",
              "Elouisa": "Kilima Village",
              "Eshe": "Mayor's Estate",
              "Hassian": "Kilima Outskirts",
              "Hekla": "Mirror Pond Ruins",
              "Hodari": "Bahari Bay",
              "Jel": "Tailor Shop",
              "Jina": "Mirror Pond Ruins",
              "Kenli": "Town Hall",
              "Kenyatta": "Town Hall / Stables",
              "Nai'o": "Daiya Farm",
              "Najuma": "Bahari Workshop",
              "Reth": "Kilima Tavern",
              "Sifuu": "Blacksmith Shop",
              "Subira": "Inn Upstairs",
              "Tamala": "Bahari Woods",
              "Tau": "Village / Farm",
              "The Gardener": "Temple of the Roots",
              "Tish": "Furniture Store",
              "Ulfe": "Bahari Bay",
              "Zeki": "General Store"
          }

          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36",
              "Accept": "application/json, text/plain, */*",
              "Referer": "https://palia.gaming.tools/tools/weekly-wants"
          }

          villagers_dict = {}

          # Attempt 1: Fetch the site HTML to discover their bundled JSON data chunk
          try:
              print("Inspecting palia.gaming.tools build manifests...")
              req = urllib.request.Request("https://palia.gaming.tools/tools/weekly-wants", headers=HEADERS)
              with urllib.request.urlopen(req, timeout=15) as res:
                  html = res.read().decode('utf-8')

              # Check for Next.js build chunk or static data asset URLs
              build_id = re.search(r'"buildId":"([^"]+)"', html)
              if build_id:
                  bid = build_id.group(1)
                  data_url = f"https://palia.gaming.tools/_next/data/{bid}/tools/weekly-wants.json"
                  print(f"Querying Next.js data endpoint: {data_url}")
                  d_req = urllib.request.Request(data_url, headers=HEADERS)
                  with urllib.request.urlopen(d_req, timeout=15) as d_res:
                      feed = json.loads(d_res.read().decode('utf-8'))
                      v_list = feed.get("pageProps", {}).get("villagers", [])
                      for v in v_list:
                          name = v.get("name")
                          wants = v.get("wants", [])
                          if name in KNOWN_VILLAGERS and wants:
                              villagers_dict[name] = [
                                  {"name": w.get("name", "Unknown"), "love": bool(w.get("rewardTier", 0) >= 3 or w.get("isLoved"))}
                                  for w in wants[:4]
                              ]
          except Exception as e:
              print(f"gaming.tools client fetch bypassed: {e}")

          # Attempt 2: Fallback to Palia Wiki API if gaming.tools was unreachable
          if len(villagers_dict) < 15:
              print("Triggering Palia Wiki backup pipeline...")
              WIKI_API = "https://palia.wiki.gg/api.php?action=parse&page=Villagers/Weekly_Wants&prop=text&format=json"
              w_req = urllib.request.Request(WIKI_API, headers={"User-Agent": "PaliaCompanionGuide/2.0"})
              try:
                  with urllib.request.urlopen(w_req, timeout=20) as w_res:
                      wiki_data = json.loads(w_res.read().decode('utf-8'))
                      html_content = wiki_data.get("parse", {}).get("text", {}).get("*", "")
                      
                      rows = re.findall(r'<tr[^>]*>(.*?)</tr>', html_content, re.DOTALL | re.IGNORECASE)
                      for row in rows:
                          cells = re.findall(r'<t[dh][^>]*>(.*?)</t[dh]>', row, re.DOTALL | re.IGNORECASE)
                          if len(cells) < 2:
                              continue
                          clean = [re.sub(r'<[^>]+>', '', c).strip() for c in cells]
                          for v in KNOWN_VILLAGERS:
                              if v.lower() in clean[0].lower() and v not in villagers_dict:
                                  items = [c for c in clean[1:] if len(c) > 2 and c.lower() not in ["like", "love", "none", "unknown"]]
                                  if len(items) >= 2:
                                      villagers_dict[v] = [
                                          {"name": itm, "love": idx >= 2} for idx, itm in enumerate(items[:4])
                                      ]
              except Exception as err:
                  print(f"Wiki fallback failed: {err}")

          # Verification and writing
          formatted_list = []
          for name in KNOWN_VILLAGERS:
              if name in villagers_dict:
                  formatted_list.append({
                      "name": name,
                      "loc": VILLAGER_LOCATIONS.get(name, "Kilima / Bahari"),
                      "wants": villagers_dict[name]
                  })

          print(f"Successfully processed {len(formatted_list)} villagers.")

          if len(formatted_list) < 15:
              print("Fatal: Could not extract minimum villager quota. Retaining existing wants.json.", file=sys.stderr)
              sys.exit(1)

          output = {
              "updated_at": datetime.utcnow().strftime("%Y-%m-%d %H:%M:%S UTC"),
              "villagers": formatted_list
          }

          with open("wants.json", "w", encoding="utf-8") as f:
              json.dump(output, f, indent=2, ensure_ascii=False)

          print("wants.json successfully updated and written.")
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add wants.json
          if git diff --staged --quiet; then
            echo "No changes in wants.json to commit."
          else
            git commit -m "chore(data): auto-sync weekly wants [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

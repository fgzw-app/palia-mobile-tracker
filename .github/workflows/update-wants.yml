name: Auto-Sync Palia Weekly Wants

on:
  schedule:
    # Sunday 21:00 UTC is in-game reset (Monday 05:00 SGT).
    # Runs Monday at 02:00 UTC (10:00 SGT) once wiki contributors record the new items.
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Scrape Wants From Palia Wiki
        run: |
          python - << 'EOF'
          import json
          import re
          import sys
          import urllib.request
          from html.parser import HTMLParser
          from datetime import datetime

          WIKI_API_URL = "https://palia.wiki.gg/api.php?action=parse&page=Villagers/Weekly_Wants&prop=text&format=json"

          HEADERS = {
              "User-Agent": "PaliaCompanionGuideBot/1.0 (Mobile App Data Sync; contact@github.com)"
          }

          class WikiWantsParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_table = False
                  self.in_row = False
                  self.in_cell = False
                  self.current_cell = []
                  self.current_row = []
                  self.rows = []

              def handle_starttag(self, tag, attrs):
                  attrs_dict = dict(attrs)
                  if tag == "table" and "wikitable" in attrs_dict.get("class", ""):
                      self.in_table = True
                  elif self.in_table and tag == "tr":
                      self.in_row = True
                      self.current_row = []
                  elif self.in_row and tag in ("td", "th"):
                      self.in_cell = True
                      self.current_cell = []

              def handle_endtag(self, tag):
                  if tag in ("td", "th") and self.in_cell:
                      cell_text = "".join(self.current_cell).strip()
                      self.current_row.append(cell_text)
                      self.in_cell = False
                  elif tag == "tr" and self.in_row:
                      if self.current_row:
                          self.rows.append(self.current_row)
                      self.in_row = False
                  elif tag == "table" and self.in_table:
                      self.in_table = False

              def handle_data(self, data):
                  if self.in_cell:
                      self.current_cell.append(data)

          print(f"Querying Palia Wiki MediaWiki endpoint...")
          req = urllib.request.Request(WIKI_API_URL, headers=HEADERS)

          try:
              with urllib.request.urlopen(req, timeout=25) as response:
                  if response.status != 200:
                      print(f"Wiki HTTP error: {response.status}", file=sys.stderr)
                      sys.exit(1)
                  payload = json.loads(response.read().decode("utf-8"))

              html_content = payload.get("parse", {}).get("text", {}).get("*", "")
              if not html_content:
                  print("Error: Empty HTML body received from wiki.", file=sys.stderr)
                  sys.exit(1)

              parser = WikiWantsParser()
              parser.feed(html_content)

              villagers_dict = {}
              KNOWN_VILLAGERS = [
                  "Ashura", "Auni", "Badruu", "Caleri", "Chayne", "Delaila", "Einar",
                  "Elouisa", "Eshe", "Hassian", "Hekla", "Hodari", "Jel", "Jina",
                  "Kenli", "Kenyatta", "Nai'o", "Najuma", "Reth", "Sifuu", "Subira",
                  "Tamala", "Tau", "Tish", "Zeki"
              ]

              for row in parser.rows:
                  clean_row = [re.sub(r'\s+', ' ', col).strip() for col in row if col.strip()]
                  if not clean_row:
                      continue

                  first_col = clean_row[0]
                  matched_name = None
                  for v in KNOWN_VILLAGERS:
                      if v.lower() in first_col.lower():
                          matched_name = v
                          break

                  if not matched_name:
                      continue

                  # Items listed across table columns (skip headers or location cells)
                  item_candidates = clean_row[1:]
                  wants = []
                  for item in item_candidates:
                      # Strip out level tags, numbers or parentheticals if present
                      clean_item = re.sub(r'\(.*?\)', '', item).strip()
                      if len(clean_item) > 2 and clean_item.lower() not in ("like", "love", "unknown", "item"):
                          # Palia Wiki standard: slots 1-2 = Like, slots 3-4 = Love
                          is_love = len(wants) >= 2
                          wants.append({
                              "name": clean_item,
                              "love": is_love
                          })

                  if wants:
                      villagers_dict[matched_name] = wants[:4]

              if len(villagers_dict) < 5:
                  print(f"Warning: Only found {len(villagers_dict)} villagers in wiki tables.", file=sys.stderr)
                  sys.exit(1)

              formatted_villagers = []
              for name, wants in villagers_dict.items():
                  formatted_villagers.append({
                      "name": name,
                      "loc": "Kilima / Bahari",
                      "wants": wants
                  })

              result_payload = {
                  "updated_at": datetime.utcnow().strftime("%Y-%m-%d %H:%M:%S UTC"),
                  "villagers": formatted_villagers
              }

              with open("wants.json", "w", encoding="utf-8") as f:
                  json.dump(result_payload, f, indent=2, ensure_ascii=False)

              print(f"Success: Extracted {len(formatted_villagers)} villagers from palia.wiki.gg!")

          except Exception as e:
              print(f"Failed to scrape wiki: {e}", file=sys.stderr)
              sys.exit(1)
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add wants.json
          if git diff --staged --quiet; then
            echo "No changes in wants.json to commit."
          else
            git commit -m "chore(data): sync weekly wants from palia.wiki.gg [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

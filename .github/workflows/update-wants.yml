name: Auto-Sync Palia Weekly Wants

on:
  schedule:
    # Runs every Monday at 05:15 SGT (Sunday 21:15 UTC, 15 minutes after reset)
    - cron: '15 21 * * 0'
  workflow_dispatch: # Allows manual trigger from GitHub web UI

jobs:
  update-wants:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fetch Latest Wants
        run: |
          # Fetch from community API / endpoints or scraper script
          python .github/scripts/fetch_wants.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add wants.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: sync weekly wants for $(date +'%Y-%m-%d')"
          git push

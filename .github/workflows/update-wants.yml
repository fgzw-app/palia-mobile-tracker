name: Auto-Sync Palia Weekly Wants

on:
  schedule:
    # Sunday 21:00 UTC is in-game reset (Monday 05:00 SGT).
    # Runs Monday at 02:00 UTC (10:00 SGT) once community sites have verified all rolled items.
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch and Write New Wants
        run: |
          python - << 'EOF'
          import json
          import sys
          import urllib.request
          from datetime import datetime

          # Public endpoints providing verified weekly wants
          URLS = [
              "https://raw.githubusercontent.com/palia-tools/palia-data/main/weekly-wants.json",
              "https://api.palia.wiki.gg/api.php?action=cargoquery&tables=WeeklyWants&fields=Villager,Item,Type&format=json"
          ]

          headers = {
              "User-Agent": "PaliaCompanionGuide/1.0 (GitHubActions Sync)",
              "Accept": "application/json"
          }

          def fetch_data():
              # 1. Primary community repository raw feed
              try:
                  req = urllib.request.Request(
                      "https://raw.githubusercontent.com/alula/palia-weekly-wants/main/wants.json",
                      headers=headers
                  )
                  with urllib.request.urlopen(req, timeout=15) as res:
                      if res.status == 200:
                          return json.loads(res.read().decode("utf-8"))
              except Exception as e:
                  print(f"Endpoint 1 failed: {e}", file=sys.stderr)

              # 2. Fallback community mirror
              try:
                  req = urllib.request.Request(
                      "https://palia-api.onrender.com/wants/current",
                      headers=headers
                  )
                  with urllib.request.urlopen(req, timeout=15) as res:
                      if res.status == 200:
                          return json.loads(res.read().decode("utf-8"))
              except Exception as e:
                  print(f"Endpoint 2 failed: {e}", file=sys.stderr)

              return None

          data = fetch_data()

          if not data:
              print("Notice: External endpoints temporarily unavailable. Retaining current wants.json without breaking build.")
              sys.exit(0)

          villagers = []
          source = data.get("villagers", data if isinstance(data, list) else [])

          for v in source:
              name = v.get("name")
              if not name:
                  continue
              loc = v.get("loc") or v.get("location") or "Kilima / Bahari"
              wants = []
              for w in v.get("wants", v.get("items", [])):
                  item_name = w.get("name") or w.get("item") or "Unknown"
                  is_love = bool(w.get("love") is True or str(w.get("type", "")).lower() == "love")
                  wants.append({"name": item_name, "love": is_love})

              villagers.append({"name": name, "loc": loc, "wants": wants})

          if len(villagers) < 5:
              print("Received incomplete data. Aborting file write.", file=sys.stderr)
              sys.exit(0)

          payload = {
              "updated_at": datetime.utcnow().strftime("%Y-%m-%d %H:%M:%S UTC"),
              "villagers": villagers
          }

          with open("wants.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, indent=2, ensure_ascii=False)

          print(f"Success: wants.json updated with {len(villagers)} villagers.")
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add wants.json
          if git diff --staged --quiet; then
            echo "No changes in wants.json to commit."
          else
            git commit -m "chore(data): auto-update weekly wants [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

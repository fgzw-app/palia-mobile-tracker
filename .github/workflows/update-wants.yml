name: Auto-Sync Palia Weekly Wants

on:
  schedule:
    # In-game reset occurs Sunday at 21:00 UTC (Monday 05:00 SGT).
    # Runs Monday at 02:00 UTC (10:00 SGT) to ensure player community trackers have datamined the list.
    - cron: '0 2 * * 1'
  workflow_dispatch: # Enables manual "Run Workflow" button in GitHub Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch and Write New Wants
        run: python .github/scripts/fetch_wants.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add wants.json
          if git diff --staged --quiet; then
            echo "No updates detected in wants.json."
          else
            git commit -m "chore(data): auto-update weekly wants [skip ci]"
            git push
          fi

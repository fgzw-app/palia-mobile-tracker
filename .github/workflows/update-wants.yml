name: Auto-Sync Palia Weekly Wants

on:
  schedule:
    # Runs Monday at 02:00 UTC (10:00 AM SGT), after reset and data confirmation
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Extract Wants from Paliapedia
        run: |
          python - << 'EOF'
          import json
          import re
          import sys
          import urllib.request
          from datetime import datetime

          URL = "https://paliapedia.com/tools/weekly-wants"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Accept-Language": "en-US,en;q=0.9"
          }

          VILLAGER_NAMES = [
              "Ashura", "Auni", "Badruu", "Caleri", "Chayne", "Delaila", "Einar",
              "Elouisa", "Eshe", "Hassian", "Hekla", "Hodari", "Jel", "Jina",
              "Kenli", "Kenyatta", "Nai'o", "Najuma", "Reth", "Sifuu", "Subira",
              "Tamala", "Tau", "Tish", "Zeki"
          ]

          try:
              print(f"Requesting {URL}...")
              req = urllib.request.Request(URL, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=25) as res:
                  html = res.read().decode("utf-8")

              # 1. Search for embedded Nuxt or Next.js state data
              nuxt_match = re.search(r'<script[^>]*id="__NUXT_DATA__"[^>]*>(.*?)</script>', html, re.DOTALL)
              next_match = re.search(r'<script[^>]*id="__NEXT_DATA__"[^>]*>(.*?)</script>', html, re.DOTALL)

              data_payload = None
              if nuxt_match:
                  print("Found __NUXT_DATA__ script block.")
                  data_payload = json.loads(nuxt_match.group(1))
              elif next_match:
                  print("Found __NEXT_DATA__ script block.")
                  data_payload = json.loads(next_match.group(1))

              villagers_dict = {}

              # Extract items if structured script was found
              if data_payload:
                  # Parse string array references from Nuxt dehydrate format
                  if isinstance(data_payload, list):
                      flat_strings = [str(x) for x in data_payload if isinstance(x, str)]
                      for i, token in enumerate(flat_strings):
                          for v_name in VILLAGER_NAMES:
                              if token.strip().lower() == v_name.lower():
                                  # Collect nearby item candidates
                                  nearby = flat_strings[i+1:i+15]
                                  valid_items = [
                                      item for item in nearby 
                                      if len(item) > 2 
                                      and not item.startswith("http") 
                                      and item not in VILLAGER_NAMES
                                      and item not in ("like", "love", "items", "wants", "id", "name")
                                  ]
                                  if valid_items and v_name not in villagers_dict:
                                      wants = []
                                      for idx, itm in enumerate(valid_items[:4]):
                                          wants.append({"name": itm, "love": idx >= 2})
                                      villagers_dict[v_name] = wants

              # 2. Fallback: Direct regex scanner across full HTML for villager-item associations
              if len(villagers_dict) < 5:
                  print("Scanning raw HTML tokens for villager wants mapping...")
                  # Matches patterns where items are listed around villager names
                  for v_name in VILLAGER_NAMES:
                      pattern = re.compile(rf'{v_name}.*?([A-Z][a-zA-Z\s\']{{3,25}})', re.IGNORECASE)
                      matches = pattern.findall(html)
                      clean_matches = [
                          m.strip() for m in matches 
                          if m.strip() not in VILLAGER_NAMES 
                          and len(m.strip()) > 3
                      ]
                      if clean_matches and v_name not in villagers_dict:
                          unique_items = list(dict.fromkeys(clean_matches))[:4]
                          if unique_items:
                              wants = [{"name": itm, "love": idx >= 2} for idx, itm in enumerate(unique_items)]
                              villagers_dict[v_name] = wants

              # If scraping still didn't extract full list, preserve existing data rather than writing empty
              if len(villagers_dict) < 5:
                  print(f"Extraction returned {len(villagers_dict)} villagers. Keeping existing wants.json.", file=sys.stderr)
                  sys.exit(0)

              formatted_list = []
              for name, wants in villagers_dict.items():
                  formatted_list.append({
                      "name": name,
                      "loc": "Kilima / Bahari",
                      "wants": wants
                  })

              output = {
                  "updated_at": datetime.utcnow().strftime("%Y-%m-%d %H:%M:%S UTC"),
                  "villagers": formatted_list
              }

              with open("wants.json", "w", encoding="utf-8") as f:
                  json.dump(output, f, indent=2, ensure_ascii=False)

              print(f"Success: Synced {len(formatted_list)} villagers from Paliapedia!")

          except Exception as e:
              print(f"Failed to scrape Paliapedia: {e}", file=sys.stderr)
              sys.exit(0)
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add wants.json
          if git diff --staged --quiet; then
            echo "No changes in wants.json to commit."
          else
            git commit -m "chore(data): auto-update weekly wants from paliapedia [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

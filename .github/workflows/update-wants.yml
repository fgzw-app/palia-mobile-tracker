name: Auto-Sync Palia Weekly Wants

on:
  schedule:
    # Runs Monday at 10:00 UTC (6:00 PM SGT)
    - cron: '0 10 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Scrape Wants from Palia Wiki API
        run: |
          python - << 'EOF'
          import json
          import re
          import sys
          import urllib.request
          from datetime import datetime

          WIKI_API = "https://palia.wiki.gg/api.php?action=parse&page=Villagers/Weekly_Wants&prop=text&format=json"
          HEADERS = {
              "User-Agent": "PaliaCompanionGuideBot/3.0 (Personal Mobile Tool; contact@github.com)"
          }

          KNOWN_VILLAGERS = [
              "Ashura", "Auni", "Badruu", "Caleri", "Chayne", "Delaila", "Einar",
              "Elouisa", "Eshe", "Hassian", "Hekla", "Hodari", "Jel", "Jina",
              "Kenli", "Kenyatta", "Nai'o", "Najuma", "Reth", "Sifuu", "Subira",
              "Tamala", "Tau", "The Gardener", "Tish", "Ulfe", "Zeki"
          ]

          VILLAGER_LOCATIONS = {
              "Ashura": "Kilima Tavern",
              "Auni": "Tavern / Fields",
              "Badruu": "Daiya Farm",
              "Caleri": "Library",
              "Chayne": "Apothecary",
              "Delaila": "Daiya Farm",
              "Einar": "Fisherman Lagoon",
              "Elouisa": "Kilima Village",
              "Eshe": "Mayor's Estate",
              "Hassian": "Kilima Outskirts",
              "Hekla": "Mirror Pond Ruins",
              "Hodari": "Bahari Bay",
              "Jel": "Tailor Shop",
              "Jina": "Mirror Pond Ruins",
              "Kenli": "Town Hall",
              "Kenyatta": "Town Hall / Stables",
              "Nai'o": "Daiya Farm",
              "Najuma": "Bahari Workshop",
              "Reth": "Kilima Tavern",
              "Sifuu": "Blacksmith Shop",
              "Subira": "Inn Upstairs",
              "Tamala": "Bahari Woods",
              "Tau": "Village / Farm",
              "The Gardener": "Temple of the Roots",
              "Tish": "Furniture Store",
              "Ulfe": "Bahari Bay",
              "Zeki": "General Store"
          }

          BANNED = {"like", "love", "unknown", "item", "wants", "gift", "gifts", "none", "tba", "star"}

          try:
              req = urllib.request.Request(WIKI_API, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=30) as res:
                  raw = json.loads(res.read().decode('utf-8'))

              html = raw.get("parse", {}).get("text", {}).get("*", "")
              if not html:
                  print("Wiki returned empty payload.", file=sys.stderr)
                  sys.exit(0)

              rows = re.findall(r'<tr[^>]*>(.*?)</tr>', html, re.DOTALL | re.IGNORECASE)
              villagers_dict = {}

              for r in rows:
                  cells = re.findall(r'<t[dh][^>]*>(.*?)</t[dh]>', r, re.DOTALL | re.IGNORECASE)
                  if len(cells) < 2:
                      continue

                  cleaned = []
                  for c in cells:
                      txt = re.sub(r'<[^>]+>', ' ', c)
                      txt = re.sub(r'&#\d+;|&[a-zA-Z]+;', ' ', txt)
                      txt = re.sub(r'\(.*?\)|\[.*?\]|\{.*?\}|\.mw-[^\s]+', '', txt)
                      txt = re.sub(r'\s+', ' ', txt).strip()
                      if txt:
                          cleaned.append(txt)

                  if not cleaned:
                      continue

                  matched_name = None
                  for v in KNOWN_VILLAGERS:
                      if re.search(rf'\b{re.escape(v.lower())}\b', cleaned[0].lower()):
                          matched_name = v
                          break

                  if matched_name and matched_name not in villagers_dict:
                      items = []
                      for candidate in cleaned[1:]:
                          cand_clean = candidate.strip()
                          if (len(cand_clean) > 2
                                  and cand_clean.lower() not in BANNED
                                  and not cand_clean.startswith((".", "#", "{", ";"))
                                  and not any(cand_clean.lower() == k.lower() for k in KNOWN_VILLAGERS)):
                              if cand_clean not in items:
                                  items.append(cand_clean)

                      if len(items) >= 2:
                          villagers_dict[matched_name] = [
                              {"name": itm, "love": idx >= 2}
                              for idx, itm in enumerate(items[:4])
                          ]

              formatted_list = []
              for name in KNOWN_VILLAGERS:
                  if name in villagers_dict:
                      formatted_list.append({
                          "name": name,
                          "loc": VILLAGER_LOCATIONS.get(name, "Kilima / Bahari"),
                          "wants": villagers_dict[name]
                      })

              print(f"Parsed {len(formatted_list)} villagers.")

              if len(formatted_list) < 15:
                  print("Warning: Insufficient data found. Aborting to prevent overwriting wants.json.")
                  sys.exit(0)

              output = {
                  "updated_at": datetime.utcnow().strftime("%Y-%m-%d %H:%M:%S UTC"),
                  "villagers": formatted_list
              }

              with open("wants.json", "w", encoding="utf-8") as f:
                  json.dump(output, f, indent=2, ensure_ascii=False)

              print("wants.json successfully updated!")

          except Exception as e:
              print(f"Error during scrape: {e}", file=sys.stderr)
              sys.exit(0)
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add wants.json
          if git diff --staged --quiet; then
            echo "No changes in wants.json to commit."
          else
            git commit -m "chore(data): auto-sync weekly wants [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

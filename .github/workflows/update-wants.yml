name: Auto-Sync Palia Weekly Wants

on:
  schedule:
    # Runs Monday at 05:00 UTC (1:00 PM SGT) — after in-game reset & wiki logs update
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Scrape Wants from Palia Wiki
        run: |
          python - << 'EOF'
          import json
          import re
          import sys
          import urllib.request
          from datetime import datetime

          WIKI_API = "https://palia.wiki.gg/api.php?action=parse&page=Villagers/Weekly_Wants&prop=text&format=json"
          HEADERS = {
              "User-Agent": "PaliaCompanionGuideBot/2.0 (Mobile App Data Sync; contact@github.com)"
          }

          KNOWN_VILLAGERS = [
              "Ashura", "Auni", "Badruu", "Caleri", "Chayne", "Delaila", "Einar",
              "Elouisa", "Eshe", "Hassian", "Hekla", "Hodari", "Jel", "Jina",
              "Kenli", "Kenyatta", "Nai'o", "Najuma", "Reth", "Sifuu", "Subira",
              "Tamala", "Tau", "The Gardener", "Tish", "Ulfe", "Zeki"
          ]

          VILLAGER_LOCATIONS = {
              "Ashura": "Kilima Tavern",
              "Auni": "Tavern / Fields",
              "Badruu": "Daiya Farm",
              "Caleri": "Library",
              "Chayne": "Apothecary",
              "Delaila": "Daiya Farm",
              "Einar": "Fisherman Lagoon",
              "Elouisa": "Kilima Village",
              "Eshe": "Mayor's Estate",
              "Hassian": "Kilima Outskirts",
              "Hekla": "Mirror Pond Ruins",
              "Hodari": "Bahari Bay",
              "Jel": "Tailor Shop",
              "Jina": "Mirror Pond Ruins",
              "Kenli": "Town Hall",
              "Kenyatta": "Town Hall / Stables",
              "Nai'o": "Daiya Farm",
              "Najuma": "Bahari Workshop",
              "Reth": "Kilima Tavern",
              "Sifuu": "Blacksmith Shop",
              "Subira": "Inn Upstairs",
              "Tamala": "Bahari Woods",
              "Tau": "Village / Farm",
              "The Gardener": "Temple of the Roots",
              "Tish": "Furniture Store",
              "Ulfe": "Bahari Bay",
              "Zeki": "General Store"
          }

          BANNED_WORDS = {
              "like", "love", "unknown", "item", "wants", "gift", 
              "gifts", "image", "file", "icon", "star", "none", "tba"
          }

          try:
              print(f"Connecting to Palia Wiki API: {WIKI_API}")
              req = urllib.request.Request(WIKI_API, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=30) as res:
                  data = json.loads(res.read().decode('utf-8'))

              html = data.get("parse", {}).get("text", {}).get("*", "")
              if not html:
                  print("Error: Empty HTML content returned from MediaWiki API.", file=sys.stderr)
                  sys.exit(1)

              # Strip all global styles, scripts, comments
              html_clean = re.sub(r'<style[^>]*>.*?</style>', '', html, flags=re.DOTALL | re.IGNORECASE)
              html_clean = re.sub(r'<script[^>]*>.*?</script>', '', html_clean, flags=re.DOTALL | re.IGNORECASE)
              html_clean = re.sub(r'<!--.*?-->', '', html_clean, flags=re.DOTALL)

              rows = re.findall(r'<tr[^>]*>(.*?)</tr>', html_clean, re.DOTALL | re.IGNORECASE)
              villagers_dict = {}

              for row in rows:
                  cells = re.findall(r'<t[dh][^>]*>(.*?)</t[dh]>', row, re.DOTALL | re.IGNORECASE)
                  if len(cells) < 2:
                      continue

                  clean_cells = []
                  for c in cells:
                      text = re.sub(r'<[^>]+>', ' ', c)
                      text = re.sub(r'&#\d+;|&[a-zA-Z]+;', ' ', text)
                      text = re.sub(r'\(.*?\)', '', text)
                      text = re.sub(r'\{.*?\}', '', text)
                      text = re.sub(r'\.mw-[^\s]+', '', text)
                      text = re.sub(r'\s+', ' ', text).strip()
                      if text:
                          clean_cells.append(text)

                  if not clean_cells:
                      continue

                  first_cell = clean_cells[0]
                  matched_villager = None

                  # Check for matching villager name in the leading text
                  for v in KNOWN_VILLAGERS:
                      pattern = r'\b' + re.escape(v.lower()) + r'\b'
                      if re.search(pattern, first_cell.lower()):
                          matched_villager = v
                          break

                  if matched_villager and matched_villager not in villagers_dict:
                      items = []
                      for candidate in clean_cells[1:]:
                          cand = candidate.strip()
                          cand_lower = cand.lower()

                          if (len(cand) > 2 
                              and cand_lower not in BANNED_WORDS
                              and not cand.startswith((".", "#", "{", ";"))
                              and not any(cand_lower == k.lower() for k in KNOWN_VILLAGERS)):
                              if cand not in items:
                                  items.append(cand)

                      if len(items) >= 2:
                          wants = []
                          for idx, itm in enumerate(items[:4]):
                              wants.append({
                                  "name": itm,
                                  "love": idx >= 2
                              })
                          villagers_dict[matched_villager] = wants

              # Verify count
              print(f"Parsed {len(villagers_dict)} of {len(KNOWN_VILLAGERS)} villagers.")

              formatted_list = []
              # Ensure consistent order across all 27 villagers
              for name in KNOWN_VILLAGERS:
                  if name in villagers_dict:
                      formatted_list.append({
                          "name": name,
                          "loc": VILLAGER_LOCATIONS.get(name, "Kilima / Bahari"),
                          "wants": villagers_dict[name]
                      })

              if len(formatted_list) < 15:
                  print("Warning: Parser found too few villagers. Retaining existing wants.json.", file=sys.stderr)
                  sys.exit(0)

              output = {
                  "updated_at": datetime.utcnow().strftime("%Y-%m-%d %H:%M:%S UTC"),
                  "villagers": formatted_list
              }

              with open("wants.json", "w", encoding="utf-8") as f:
                  json.dump(output, f, indent=2, ensure_ascii=False)

              print(f"Success: Synced all {len(formatted_list)} villagers into wants.json!")

          except Exception as e:
              print(f"Scraper error: {e}", file=sys.stderr)
              sys.exit(0)
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add wants.json
          if git diff --staged --quiet; then
            echo "No changes in wants.json to commit."
          else
            git commit -m "chore(data): sync full villager roster from palia.wiki.gg [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

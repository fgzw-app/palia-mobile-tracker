name: Auto-Sync Palia Weekly Wants

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch and Write New Wants
        run: |
          python - << 'EOF'
          import json
          import sys
          import urllib.request
          from datetime import datetime

          ENDPOINTS = [
              "https://paliatracker.com/api/v1/wants",
              "https://api.paliatracker.com/wants"
          ]

          HEADERS = {
              "User-Agent": "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/15E148",
              "Accept": "application/json"
          }

          def fetch_data():
              for url in ENDPOINTS:
                  try:
                      print(f"Fetching from: {url}")
                      req = urllib.request.Request(url, headers=HEADERS)
                      with urllib.request.urlopen(req, timeout=15) as res:
                          if res.status == 200:
                              return json.loads(res.read().decode("utf-8"))
                  except Exception as e:
                      print(f"Failed pulling from {url}: {e}", file=sys.stderr)
              return None

          raw_data = fetch_data()
          if not raw_data:
              print("Warning: Could not contact endpoints. Preserving existing wants.json.", file=sys.stderr)
              sys.exit(0)

          villagers_list = []
          source = raw_data.get("villagers", raw_data if isinstance(raw_data, list) else [])

          for v in source:
              name = v.get("name")
              if not name:
                  continue
              loc = v.get("loc") or v.get("location") or "Kilima / Bahari"
              wants = []
              for w in v.get("wants", []):
                  item_name = w.get("name") or w.get("item") or "Unknown"
                  is_love = bool(w.get("love", False) or str(w.get("type", "")).lower() == "love")
                  wants.append({"name": item_name, "love": is_love})

              villagers_list.append({"name": name, "loc": loc, "wants": wants})

          if len(villagers_list) < 5:
              print("Received incomplete payload. Skipping write.", file=sys.stderr)
              sys.exit(0)

          output = {
              "updated_at": datetime.utcnow().strftime("%Y-%m-%d %H:%M:%S UTC"),
              "villagers": villagers_list
          }

          with open("wants.json", "w", encoding="utf-8") as f:
              json.dump(output, f, indent=2, ensure_ascii=False)

          print(f"Successfully updated wants.json with {len(villagers_list)} villagers.")
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add wants.json
          if git diff --staged --quiet; then
            echo "No changes in wants.json to commit."
          else
            git commit -m "chore(data): auto-update weekly wants [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

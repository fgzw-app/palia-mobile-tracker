name: Auto-Sync Palia Weekly Wants

on:
  schedule:
    # Sunday 21:00 UTC is in-game reset (Monday 05:00 SGT).
    # Runs Monday at 02:00 UTC (10:00 SGT) once community sites have verified all rolled items.
    - cron: '0 2 * * 1'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch and Write New Wants
        run: |
          python - << 'EOF'
          import json
          import sys
          import urllib.request
          from datetime import datetime

          TARGET_URL = "https://paliatracker.com/data/weekly-wants.json"

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
              "Accept": "application/json, text/plain, */*"
          }

          try:
              print(f"Fetching from {TARGET_URL}...")
              req = urllib.request.Request(TARGET_URL, headers=headers)
              with urllib.request.urlopen(req, timeout=25) as res:
                  if res.status != 200:
                      print(f"Failed with status: {res.status}", file=sys.stderr)
                      sys.exit(1)
                  raw = json.loads(res.read().decode("utf-8"))

              villagers_list = []
              records = raw.get("villagers", raw)
              
              if isinstance(records, dict):
                  iterable = [{"name": k, **v} for k, v in records.items()]
              else:
                  iterable = records

              for entry in iterable:
                  v_name = entry.get("name")
                  if not v_name:
                      continue

                  location = entry.get("loc") or entry.get("location") or "Kilima / Bahari"
                  wants = []
                  raw_wants = entry.get("wants") or entry.get("items") or []
                  
                  for w in raw_wants:
                      if isinstance(w, str):
                          wants.append({"name": w, "love": False})
                      elif isinstance(w, dict):
                          item_name = w.get("name") or w.get("item") or w.get("reward") or "Unknown"
                          is_love = bool(
                              w.get("love") is True or 
                              str(w.get("type", "")).lower() == "love" or 
                              w.get("tier", 0) >= 3
                          )
                          wants.append({"name": item_name, "love": is_love})

                  villagers_list.append({
                      "name": v_name,
                      "loc": location,
                      "wants": wants
                  })

              if not villagers_list:
                  print("Error: No villager items parsed from payload.", file=sys.stderr)
                  sys.exit(1)

              payload = {
                  "updated_at": datetime.utcnow().strftime("%Y-%m-%d %H:%M:%S UTC"),
                  "villagers": villagers_list
              }

              with open("wants.json", "w", encoding="utf-8") as f:
                  json.dump(payload, f, indent=2, ensure_ascii=False)

              print(f"Success: Updated wants.json with {len(villagers_list)} villagers.")

          except Exception as e:
              print(f"Execution failed: {e}", file=sys.stderr)
              sys.exit(1)
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add wants.json
          if git diff --staged --quiet; then
            echo "No changes in wants.json to commit."
          else
            git commit -m "chore(data): auto-update weekly wants [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
